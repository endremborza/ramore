name: Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: '3.12'
        enable-cache: true
    - run: uv run ramore demo --out demo
    - uses: actions/upload-pages-artifact@v5
      with:
        path: demo/store/site
    - id: deployment
      uses: actions/deploy-pages@v5
